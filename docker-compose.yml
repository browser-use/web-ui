services:
  # debug: docker compose run --rm -it browser-use-webui bash
  browser-use-webui:
    # image: ghcr.io/browser-use/web-ui:latest # Using precompiled image
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/amd64}
    ports:
      - "127.0.0.1:7788:7788"
      - "0.0.0.0:6080:6080"
      - "127.0.0.1:5901:5901"
      # CDP: socat listens on 9222 and forwards to Chrome on 9223. Available after first agent task (Chrome starts then).
      - "127.0.0.1:9222:9222"
    environment:
      # LLM API Keys & Endpoints
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_ENDPOINT=${ANTHROPIC_ENDPOINT:-https://api.anthropic.com}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}
      - DEEPSEEK_ENDPOINT=${DEEPSEEK_ENDPOINT:-https://api.deepseek.com}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://localhost:11434}
      - MISTRAL_ENDPOINT=${MISTRAL_ENDPOINT:-https://api.mistral.ai/v1}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - ALIBABA_ENDPOINT=${ALIBABA_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - ALIBABA_API_KEY=${ALIBABA_API_KEY:-}
      - MOONSHOT_ENDPOINT=${MOONSHOT_ENDPOINT:-https://api.moonshot.cn/v1}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - UNBOUND_ENDPOINT=${UNBOUND_ENDPOINT:-https://api.getunbound.ai}
      - UNBOUND_API_KEY=${UNBOUND_API_KEY:-}
      - SiliconFLOW_ENDPOINT=${SiliconFLOW_ENDPOINT:-https://api.siliconflow.cn/v1/}
      - SiliconFLOW_API_KEY=${SiliconFLOW_API_KEY:-}
      - IBM_ENDPOINT=${IBM_ENDPOINT:-https://us-south.ml.cloud.ibm.com}
      - IBM_API_KEY=${IBM_API_KEY:-}
      - IBM_PROJECT_ID=${IBM_PROJECT_ID:-}

      # Application Settings
      - ANONYMIZED_TELEMETRY=${ANONYMIZED_TELEMETRY:-false}
      - BROWSER_USE_LOGGING_LEVEL=${BROWSER_USE_LOGGING_LEVEL:-info}

      # Browser Settings (paths are inside the container; ./profiles is mounted at /profiles)
      - BROWSER_PATH=
      - BROWSER_USER_DATA=/profiles/agent-default
      # Chrome CDP: in Docker, Chrome listens on 127.0.0.1:9223 only (Chromium ignores 0.0.0.0). socat forwards 0.0.0.0:9222 -> 127.0.0.1:9223.
      - BROWSER_DEBUGGING_PORT=${BROWSER_DEBUGGING_PORT:-9223}
      - BROWSER_DEBUGGING_HOST=0.0.0.0
      - USE_OWN_BROWSER=false
      - KEEP_BROWSER_OPEN=true
      # Startup browser: when true, Chromium starts at container boot and WebUI connects via BROWSER_CDP. Set LAUNCH_BROWSER_AT_STARTUP=false and BROWSER_CDP= to launch browser only on first run_agent.
      - LAUNCH_BROWSER_AT_STARTUP=${LAUNCH_BROWSER_AT_STARTUP:-true}
      - BROWSER_CDP=${BROWSER_CDP:-http://127.0.0.1:9222}
      - PLAYWRIGHT_LAUNCH_ARGS=--no-sandbox --disable-blink-features=AutomationControlled --disable-dev-shm-usage --disable-infobars --disable-features=TranslateUI --remote-debugging-port=9223 --disable-extensions-except=/ms-playwright/stealth-extension --load-extension=/ms-playwright/stealth-extension

      # Display Settings
      - DISPLAY=:99
      - PLAYWRIGHT_BROWSERS_PATH=/ms-browsers
      - RESOLUTION=${RESOLUTION:-1920x1080x24}
      - RESOLUTION_WIDTH=${RESOLUTION_WIDTH:-1920}
      - RESOLUTION_HEIGHT=${RESOLUTION_HEIGHT:-1080}

      # VNC Settings
      - VNC_PASSWORD=${VNC_PASSWORD:-}

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/data
      - ./profiles:/profiles
      - ./output:/output
      - ./stealth-extension:/ms-playwright/stealth-extension
    restart: unless-stopped
    shm_size: "2gb"
    cap_add:
      - SYS_ADMIN
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5901"] # VNC port
      interval: 10s
      timeout: 5s
      retries: 3